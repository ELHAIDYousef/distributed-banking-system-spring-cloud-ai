spring:
  application:
    name: customer-service

  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:configserver:"

  datasource:
    url: jdbc:postgresql://${CUSTOMER_DB_HOST}:${CUSTOMER_DB_PORT}/${CUSTOMER_DB_NAME}
    username: ${CUSTOMER_DB_USERNAME}
    password: ${CUSTOMER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    discovery:
      enabled: true
    config:
      enabled: false

  ai:
    mcp:
      server:
        name: customer-mcp-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE

eureka:
  instance:
    prefer-ip-address: true

server:
  port: 8081