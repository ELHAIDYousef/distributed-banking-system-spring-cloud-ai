spring:
  application:
    name: ebank-bot

  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

server:
  port: 8084

eureka:
  instance:
    prefer-ip-address: true