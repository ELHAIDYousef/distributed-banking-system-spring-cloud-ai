spring:
  application:
    name: ebank-bot

  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: qwen/qwen3.8-27b
        extra-body:
          reasoning_effort: none

server:
  port: 8084

eureka:
  instance:
    prefer-ip-address: true